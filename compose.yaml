name: hannariko

services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the image to deploy}
    env_file: .env
    environment:
      DATABASE_URL: file:/data/mastra.db
      DUCKDB_PATH: /data/mastra.duckdb
    volumes:
      - data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 60s
      interval: 30s
      timeout: 5s
    logging:
      driver: local

volumes:
  data:
