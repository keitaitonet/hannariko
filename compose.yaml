name: hannariko

services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the image digest to deploy}
    env_file:
      - path: .env
        format: raw
    environment:
      DISCORD_GUILD_ID: "1312051401622294528"
      OPENAI_MODEL: gpt-6-luna
      AWS_REGION: ap-northeast-1
      DYNAMODB_TABLE_NAME: hannariko-memory
    init: true
    restart: unless-stopped
    logging:
      driver: local
